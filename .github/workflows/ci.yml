name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # Catches size-dependent constants and int overflows that a
      # 64-bit build accepts.
      - name: Build for 32-bit
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=386 go build ./...
